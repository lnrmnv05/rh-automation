<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retail&Horeca — Автоматизация вашего бизнеса</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        /* --- Сброс --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        html, body, .slides-container {
            background-color: #D5C9C6;
            transition: background-color 0.1s ease;
        }
        body {
            font-family: Arial, sans-serif;
        }

        body.dark-theme,
        body.dark-theme html,
        body.dark-theme .slides-container {
            background-color: #464342;
        }

        /* --- Лоадер --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #D5C9C6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-logo {
            width: 120px;
            height: auto;
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .loader-logo.loaded {
            opacity: 1;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-top-color: #464342;
            animation: spin 1s linear infinite;
        }
        body.dark-theme #loader {
            background-color: #464342;
        }
        body.dark-theme .loader-spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Контейнер слайдов --- */
        .slides-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.1s ease;
        }

        /* --- Обычные слайды --- */
        .slide {
            width: 100%;
            height: 100vh;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background-color: #D5C9C6;
            transition: background-color 0.1s ease;
            opacity: 0;
            transition: opacity 0.7s ease, background-color 0.1s ease;
            will-change: opacity;
            margin: 0;
            padding: 0;
        }
        .slide.visible {
            opacity: 1;
        }
        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 0;
            box-shadow: none;
            transition: opacity 0.8s ease;
            background-color: transparent;
        }
        body.dark-theme .slide {
            background-color: #464342;
        }

        /* --- Планшетный длинный слайд --- */
        .slide-tablet {
            width: 100%;
            height: auto;
            min-height: 100vh;
            display: none;
        }
        .slide-tablet img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0;
            box-shadow: none;
            transition: opacity 0.8s ease;
            background-color: transparent;
        }
        .tablet-mode .slide {
            display: none;
        }
        .tablet-mode .slide-tablet {
            display: block !important;
        }

        /* --- Кнопка переключения темы --- */
        .theme-toggle {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }
        body.dark-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        .theme-toggle.animating {
            animation: pulse 0.6s ease;
        }
        .theme-toggle.animating .toggle-track {
            background: rgba(0, 0, 0, 0.25);
            transition: background 0.2s ease;
        }
        body.dark-theme .theme-toggle.animating .toggle-track {
            background: rgba(255, 255, 255, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        .toggle-track {
            position: relative;
            width: 80px;
            height: 36px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            transition: background 0.3s ease;
        }
        .toggle-icon {
            font-size: 18px;
            line-height: 1;
            user-select: none;
            z-index: 2;
            display: flex;
            align-items: center;
        }
        .toggle-icon svg {
            display: block;
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.3));
        }
        .toggle-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 28px;
            height: 28px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.6s ease, background 0.6s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 3;
        }
        body.dark-theme .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        body.dark-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        body.dark-theme .toggle-track {
            background: rgba(255, 255, 255, 0.2);
        }
        body.dark-theme .toggle-thumb {
            transform: translateX(44px);
        }

        body.theme-switching .slide img,
        body.theme-switching .slide-tablet img {
            opacity: 0 !important;
            transition: opacity 0.8s ease;
        }

        /* --- Левая группа кнопок --- */
        .left-bottom-buttons {
            position: fixed;
            bottom: 40px;
            left: 40px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }
        .btn-icon-glass {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 16px;
            color: #222;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        body.dark-theme .btn-icon-glass {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .btn-icon-glass:hover {
            background: rgba(0, 0, 0, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }
        body.dark-theme .btn-icon-glass:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }
        .btn-icon-glass.pulse-on-click {
            animation: pulse 0.6s ease;
        }
        .btn-icon-glass .btn-text {
            display: inline-block;
        }
        @media (max-width: 480px) {
            .btn-icon-glass .btn-text {
                display: none;
            }
            .btn-icon-glass {
                padding: 10px 14px;
            }
        }

        /* --- Уведомление --- */
        #toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
        }
        body.dark-theme #toast {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* --- Кнопка "Связаться" --- */
        .btn-contact-container {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 1000;
        }
        .btn-glass {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 12px 22px;
            color: #222;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        body.dark-theme .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .btn-glass:hover {
            background: rgba(0, 0, 0, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }
        body.dark-theme .btn-glass:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }
        .btn-glass.pulse-on-click {
            animation: pulse 0.6s ease;
        }

        /* --- Модальное окно --- */
        #modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #modalOverlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            text-align: center;
        }
        #modalOverlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            color: #222;
        }
        .modal-content a {
            color: #464342;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .modal-content a:hover {
            color: #000;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: #222;
            transition: transform 0.2s;
        }
        .modal-content .close-btn:hover {
            transform: rotate(90deg);
        }
        body.dark-theme .modal-content {
            background: rgba(20, 20, 20, 0.95);
            color: #f0f0f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.dark-theme .modal-content a {
            color: #ffcc77;
        }
        body.dark-theme .modal-content a:hover {
            color: #ffaa33;
        }
        body.dark-theme .modal-content .close-btn {
            color: #f0f0f0;
        }
        body.dark-theme .modal-content .close-btn:hover {
            color: #fff;
        }

        /* --- Адаптация для мобильных (увеличенная кнопка) --- */
        @media (max-width: 480px) {
            .theme-toggle {
                top: 15px;
                left: 15px;
                padding: 8px 14px;           /* увеличено */
            }
            .toggle-track {
                width: 64px;                 /* увеличено */
                height: 30px;                /* увеличено */
                padding: 0 6px;
            }
            .toggle-thumb {
                width: 20px;                 /* увеличено */
                height: 20px;
                top: 5px;
                left: 5px;
            }
            body.dark-theme .toggle-thumb {
                transform: translateX(34px); /* 64 - 2*5 - 20 = 34 */
            }
            .toggle-icon {
                font-size: 14px;             /* увеличено */
            }
            .toggle-icon svg {
                width: 16px;                 /* увеличено */
                height: 16px;
            }
            .theme-toggle:hover {
                transform: none;
                box-shadow: none;
            }
            .loader-logo {
                width: 80px;
            }
            .left-bottom-buttons {
                bottom: 20px;
                left: 20px;
                gap: 10px;
            }
            .btn-contact-container {
                bottom: 20px;
                right: 20px;
            }
            .btn-glass {
                padding: 10px 16px;
                font-size: 14px;
                border-radius: 30px;
            }
            .btn-icon-glass {
                padding: 8px 12px;
                border-radius: 30px;
            }
            .modal-content {
                padding: 30px 20px;
            }
            .modal-content h2 {
                font-size: 22px;
            }
            #toast {
                font-size: 14px;
                padding: 10px 20px;
                bottom: 100px;
            }
        }
        @media (min-width: 481px) and (max-width: 1024px) {
            .left-bottom-buttons {
                bottom: 30px;
                left: 30px;
            }
            .btn-contact-container {
                bottom: 30px;
                right: 30px;
            }
        }
    </style>
</head>
<body>

    <script>
        // ============================================================
        // 0. ОПРЕДЕЛЕНИЕ ПЛАНШЕТА (БЕЗ УЧЁТА ОРИЕНТАЦИИ)
        // ============================================================
        function isTablet() {
            const w = window.innerWidth;
            return w >= 768 && w <= 1024;
        }

        // ============================================================
        // 1. ОПРЕДЕЛЕНИЕ ПАПКИ
        // ============================================================
        function getFolder(theme) {
            const isMobile = window.innerWidth <= 768 && window.matchMedia('(orientation: portrait)').matches;
            const base = theme === 'light' ? 'light' : 'dark';
            if (isMobile) return base + '-mobile';
            if (isTablet()) return base + '-tablet';
            return base;
        }

        // ============================================================
        // 2. ПОСТРОЕНИЕ СЛАЙДОВ + ЛОАДЕР
        // ============================================================
        const totalSlides = 10;
        const slidesContainer = document.getElementById('slidesContainer');
        let imagesLoaded = 0;
        const loader = document.getElementById('loader');
        const loaderLogo = document.getElementById('loaderLogo');

        function updateLoaderLogo(theme) {
            loaderLogo.src = theme === 'dark' ? 'logo-dark.png' : 'logo-light.png';
        }

        const isDarkOnLoad = document.body.classList.contains('dark-theme');
        updateLoaderLogo(isDarkOnLoad ? 'dark' : 'light');

        setTimeout(() => loaderLogo.classList.add('loaded'), 300);

        const MIN_LOADER_DISPLAY = 2000;
        let loaderStartTime = Date.now();

        function buildSlides() {
            slidesContainer.innerHTML = '';
            const tablet = isTablet();

            if (tablet) {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide-tablet';
                const img = document.createElement('img');
                const orientation = window.matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
                img.src = `light-tablet/full-slide-${orientation}.png`;
                img.alt = 'Планшетная презентация';
                img.onload = function() {
                    imagesLoaded++;
                    checkAndHideLoader();
                };
                if (img.complete) {
                    imagesLoaded++;
                    checkAndHideLoader();
                }
                slideDiv.appendChild(img);
                slidesContainer.appendChild(slideDiv);
            } else {
                for (let i = 1; i <= totalSlides; i++) {
                    const slide = document.createElement('div');
                    slide.className = 'slide';
                    const img = document.createElement('img');
                    img.src = `light/slide${i}.png`;
                    img.alt = `Слайд ${i}`;
                    img.onload = function() {
                        imagesLoaded++;
                        checkAndHideLoader();
                    };
                    if (img.complete) {
                        imagesLoaded++;
                        checkAndHideLoader();
                    }
                    slide.appendChild(img);
                    slidesContainer.appendChild(slide);
                }
            }

            if (tablet) {
                document.body.classList.add('tablet-mode');
            } else {
                document.body.classList.remove('tablet-mode');
            }
        }

        function checkAndHideLoader() {
            const total = isTablet() ? 1 : totalSlides;
            if (imagesLoaded >= total) {
                const elapsed = Date.now() - loaderStartTime;
                const remaining = Math.max(0, MIN_LOADER_DISPLAY - elapsed);
                setTimeout(() => hideLoader(), remaining);
            }
        }

        function hideLoader() {
            if (!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                setTimeout(() => loader.style.display = 'none', 800);
            }
        }

        const fallbackTimeout = setTimeout(() => {
            if (!loader.classList.contains('hidden')) hideLoader();
        }, 8000);

        buildSlides();

        // ============================================================
        // 3. ПЛАВНОЕ ПОЯВЛЕНИЕ СЛАЙДОВ
        // ============================================================
        let slides = document.querySelectorAll('.slide');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });

        slides.forEach(slide => observer.observe(slide));

        window.addEventListener('load', () => {
            if (!isTablet()) {
                slides[0].classList.add('visible');
            }
            const allImgs = document.querySelectorAll('.slide img, .slide-tablet img');
            let allLoaded = true;
            allImgs.forEach(img => { if (!img.complete) allLoaded = false; });
            if (allLoaded && imagesLoaded >= (isTablet() ? 1 : totalSlides)) {
                const elapsed = Date.now() - loaderStartTime;
                const remaining = Math.max(0, MIN_LOADER_DISPLAY - elapsed);
                setTimeout(() => {
                    hideLoader();
                    clearTimeout(fallbackTimeout);
                }, remaining);
            }
        });

        // ============================================================
        // 4. ОБНОВЛЕНИЕ ИЗОБРАЖЕНИЙ
        // ============================================================
        let currentTheme = 'light';

        function updateImages(theme) {
            const tablet = isTablet();
            const folder = getFolder(theme);

            if (tablet) {
                const img = document.querySelector('.slide-tablet img');
                if (img) {
                    const orientation = window.matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
                    img.src = `${folder}/full-slide-${orientation}.png`;
                }
            } else {
                const imgs = document.querySelectorAll('.slide img');
                imgs.forEach((img, index) => {
                    const num = index + 1;
                    img.src = `${folder}/slide${num}.png`;
                });
            }
            updateLoaderLogo(theme);
        }

        updateImages('light');

        // ============================================================
        // 5. ПЕРЕКЛЮЧЕНИЕ ТЕМЫ
        // ============================================================
        const toggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        function preloadImages(theme) {
            const folder = getFolder(theme);
            const tablet = isTablet();
            if (tablet) {
                const orientation = window.matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
                const url = `${folder}/full-slide-${orientation}.png`;
                const img = new Image();
                img.src = url;
            } else {
                const imgs = document.querySelectorAll('.slide img');
                imgs.forEach((img, index) => {
                    const num = index + 1;
                    const url = `${folder}/slide${num}.png`;
                    const newImg = new Image();
                    newImg.src = url;
                });
            }
        }

        let isAnimating = false;

        function toggleTheme() {
            if (isAnimating) return;
            isAnimating = true;

            toggleBtn.classList.add('animating');

            const isDark = body.classList.contains('dark-theme');
            const nextTheme = isDark ? 'light' : 'dark';

            preloadImages(nextTheme);
            body.classList.add('theme-switching');

            setTimeout(() => {
                updateImages(nextTheme);
                currentTheme = nextTheme;
                setTimeout(() => {
                    body.classList.remove('theme-switching');
                    toggleBtn.classList.remove('animating');
                    isAnimating = false;
                }, 600);
            }, 800);

            if (isDark) {
                body.classList.remove('dark-theme');
            } else {
                body.classList.add('dark-theme');
            }
        }

        toggleBtn.addEventListener('click', toggleTheme);

        // ============================================================
        // 6. АДАПТАЦИЯ ПРИ ПОВОРОТЕ / РЕСАЙЗЕ
        // ============================================================
        function handleResize() {
            const wasTablet = document.body.classList.contains('tablet-mode');
            const currentTablet = isTablet();

            if (wasTablet !== currentTablet) {
                const theme = currentTheme;
                buildSlides();
                slides = document.querySelectorAll('.slide');
                slides.forEach(slide => observer.observe(slide));
                if (!isTablet()) {
                    slides[0].classList.add('visible');
                }
                updateImages(theme);
            } else {
                updateImages(currentTheme);
            }
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 300);
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 500);
        });

        // ============================================================
        // 7. КНОПКА "ПОДЕЛИТЬСЯ"
        // ============================================================
        const btnShare = document.getElementById('btnShare');
        const toast = document.getElementById('toast');
        let toastTimeout;

        btnShare.addEventListener('click', function() {
            const url = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('Ссылка скопирована!');
                }).catch(() => {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
            this.classList.add('pulse-on-click');
            setTimeout(() => this.classList.remove('pulse-on-click'), 600);
        });

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Ссылка скопирована!');
            } catch (e) {
                showToast('Не удалось скопировать ссылку');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 8. КНОПКА "ПОЛНЫЙ ЭКРАН"
        // ============================================================
        const btnFullscreen = document.getElementById('btnFullscreen');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast('Не удалось открыть в полный экран');
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        btnFullscreen.addEventListener('click', function() {
            toggleFullscreen();
            this.classList.add('pulse-on-click');
            setTimeout(() => this.classList.remove('pulse-on-click'), 600);
        });

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcon);

        function updateFullscreenIcon() {
            if (document.fullscreenElement) {
                fullscreenIcon.innerHTML = `
                    <polyline points="15 3 21 3 21 9"/>
                    <polyline points="9 21 3 21 3 15"/>
                    <line x1="21" y1="3" x2="14" y2="10"/>
                    <line x1="3" y1="21" x2="10" y2="14"/>
                `;
                btnFullscreen.querySelector('.btn-text').textContent = 'Выйти';
            } else {
                fullscreenIcon.innerHTML = `
                    <polyline points="15 3 21 3 21 9"/>
                    <polyline points="9 21 3 21 3 15"/>
                    <line x1="21" y1="3" x2="14" y2="10"/>
                    <line x1="3" y1="21" x2="10" y2="14"/>
                `;
                btnFullscreen.querySelector('.btn-text').textContent = 'На весь экран';
            }
        }

        // ============================================================
        // 9. КНОПКА "СВЯЗАТЬСЯ"
        // ============================================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const btnContact = document.getElementById('btnContact');

        function openModal() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        btnContact.addEventListener('click', () => {
            openModal();
            btnContact.classList.add('pulse-on-click');
            setTimeout(() => btnContact.classList.remove('pulse-on-click'), 600);
        });

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // 10. ЗАВЕРШЕНИЕ
        // ============================================================
        window.addEventListener('load', () => {
            const allImgs = document.querySelectorAll('.slide img, .slide-tablet img');
            allImgs.forEach(img => img.style.opacity = '1');
            updateImages(currentTheme);
        });
    </script>
</body>
</html>
